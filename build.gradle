plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}" apply false
	id 'maven-publish'
	id 'java'
	id 'base'
}

version = project.mod_version
group = project.maven_group

java {
	sourceCompatibility = targetCompatibility = JavaVersion.VERSION_25
	tasks.withType(JavaCompile).configureEach {
		it.options.release = 25
	}
}

/* configurations for each projects */
project(":sevenstars-api") {
	java {
		sourceCompatibility = targetCompatibility = JavaVersion.VERSION_25
	}
	tasks.withType(JavaCompile).configureEach {
		it.options.release = 25
	}
}

project(":middle-earth") {
	java {
		sourceCompatibility = targetCompatibility = JavaVersion.VERSION_25
	}
	tasks.withType(JavaCompile).configureEach {
		it.options.release = 25
	}
}

project(":of-beasts-and-wild-things") {
	java {
		sourceCompatibility = targetCompatibility = JavaVersion.VERSION_25
	}
	tasks.withType(JavaCompile).configureEach {
		it.options.release = 25
	}
}

subprojects() {
	apply plugin: 'net.fabricmc.fabric-loom'

	version = project.mod_version
	group = project.maven_group

	base {
		archivesName = project.archives_base_name
	}

	dependencies {
		// Minecraft 26.1+ ships unobfuscated; no mappings are needed or allowed
		minecraft "com.mojang:minecraft:${project.minecraft_version}"
		implementation "net.fabricmc:fabric-loader:${project.loader_version}"
		implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
	}

	processResources {
		// datagen output (src/main/generated) overlaps hand-written resources mid-migration;
		// first source root wins, so hand-written files take precedence
		duplicatesStrategy = DuplicatesStrategy.EXCLUDE

		def version = project.version
		inputs.property "version", version

		filesMatching("fabric.mod.json") {
			expand "version": version
		}
	}

	sourceSets.main.resources.srcDirs += 'src/main/generated'

	jar {
		def baseName = project.archives_base_name
		from("LICENSE") {
			rename { "${it}_${baseName}"}
		}
	}
}

// root project will not build anything
jar.enabled = false

jar {
	zip64 = true
}
tasks.withType(Jar).configureEach {
	zip64 = true
}

tasks.register("copyFiles", Copy) {
	rootProject.subprojects.each {project ->
		from project.name + '/build/libs/' + project.archives_base_name + '-' + project.version + '.jar'
	}
	into "build/libs"
}

// make sure the copy task runs after each subproject is built
copyFiles.dependsOn {
	subprojects.collect {
		it.tasks.named("build")
	}
}

build {
	finalizedBy copyFiles
}
